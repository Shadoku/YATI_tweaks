name: CI

# Builds the native importer (native/, a Rust GDExtension) for linux x86_64, loads it in the
# Godot of .godot-version, and runs the test suite: the GDScript runtime (runtime/) and the
# native importer's facade (addons/yati_native/, docs/native-importer-plan.md stage 2) must both
# pass it. The platform libraries that get committed and published are native.yml's job, not
# this one's.

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        uses: actions/cache@v4
        with:
          path: ~/.cache/godot
          key: godot-${{ runner.os }}-${{ hashFiles('.godot-version') }}

      - name: Install Godot
        run: |
          set -euo pipefail
          GODOT="$(bash tools/install_godot.sh | tail -n 1)"
          echo "GODOT=$GODOT" >> "$GITHUB_ENV"

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@1.97.0 # pinned: clippy lints change between stable releases; bump with the development machines
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry and native/target/
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native -> target

      - name: Build the native importer
        run: bash tools/build_native.sh

      # The pure-Rust core (native/tiled/, tiled_core): its unit, loader, payload and parity
      # tests (the parity dumps are committed, so no Godot is needed); lints and formatting of
      # both crates (the GDExtension's own unit tests need no engine either).
      - name: Test the Rust crates
        working-directory: native
        run: |
          set -euo pipefail
          cargo test --release --workspace
          cargo clippy --release --workspace --all-targets -- -D warnings
          cargo fmt --all -- --check

      # Godot loads a GDExtension at startup only when .godot/extension_list.cfg names it
      # (and a fresh .godot/'s first import that discovers one mid-scan aborts at shutdown);
      # test/run_all.sh seeds the same file.
      - name: Load the native importer in Godot
        run: |
          set -euo pipefail
          mkdir -p .godot
          echo "res://addons/yati_native/yati_native.gdextension" > .godot/extension_list.cfg
          "$GODOT" --headless --path . -s tools/smoke_native.gd

      - name: Test the GDScript runtime (smoke test, test suite, benchmark)
        run: sh test/run_all.sh --runtime=res://runtime

      # The same suite against the native importer's facade (stage 2's gate).
      - name: Test the native importer's facade
        run: '"$GODOT" --headless -s test/run_tests.gd -- --runtime=res://addons/yati_native'

      # No leaks over 20 rounds of every fixture, the small map's time, the engine's floor
      # (tools/native_gate.gd), and the benchmark for the record.
      - name: Check the native importer (leaks, small map, benchmark)
        run: |
          set -euo pipefail
          "$GODOT" --headless -s tools/native_gate.gd
          "$GODOT" --headless -s test/benchmark.gd -- --runtime=res://addons/yati_native
