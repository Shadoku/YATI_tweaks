[package]
name = "yati_native"
version = "0.2.0"
edition = "2021"
description = "The YATI runtime importer as a Godot GDExtension (godot-rust): Tiled maps imported and streamed natively."
license = "MIT"
publish = false

# The pure-Rust core crate, native/tiled/ (`tiled_core`: the Tiled data model, its parsers, the
# payload decoding and the tile_map_data blobs; no Godot types), is a workspace member and a
# dependency; this crate is the Godot side (the classes, the builders). The worker thread of the
# async loader runs tiled_core only (docs/native-importer-plan.md, section 2).

[workspace]
members = [".", "tiled"]

[lib]
crate-type = ["cdylib"]

[features]
# godot-rust's checks on every engine call (is the object alive) off in release builds: about 30 %
# off the object phase of a large map (docs/native-importer-plan.md, stage 2), at the price of
# undefined behaviour instead of a panic should a node be freed under the builder (a user script's
# _init freeing nodes of the tree being built). Off by default; the CI builds do not enable it.
unchecked = ["godot/safeguards-release-disengaged"]

[dependencies]
godot = { version = "0.5", features = ["api-4-7"] }
tiled_core = { path = "tiled" }

[profile.release]
opt-level = 3
lto = "thin"
