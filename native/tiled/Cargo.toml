[package]
name = "tiled_core"
version = "0.1.0"
edition = "2021"
description = "Tiled map (TMX/TMJ) data model, parsers, payload decoding and Godot tile_map_data blobs, without Godot"
license = "MIT"
publish = false

[lib]
path = "src/lib.rs"

[features]
default = ["zstd"]
# base64 + zstd layer payloads (binds the C zstd library)
zstd = ["dep:zstd"]

[dependencies]
base64 = "0.22"
memchr = "2"
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
quick-xml = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate-flate2", "flate2"] }
zstd = { version = "0.13", optional = true, default-features = false }

[[example]]
name = "bench"
